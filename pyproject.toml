[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "atlasrag-engineering"
version = "0.1.0"
description = "Local-first hybrid retrieval, grounded evidence and evaluation platform"
requires-python = ">=3.10"
[project.scripts]
atlasrag = "atlasrag.cli:main"
[tool.setuptools.packages.find]
include = ["atlasrag*"]
